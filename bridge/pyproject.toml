[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stardew-bridge"
version = "0.1.0"
description = "Python bridge between Stardew Valley (C# SMAPI mod) and AI agent pipelines (MCP / OpenAI tool-calling)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
tests = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
stardew-bridge = "stardew_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stardew_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]